# gVisor RuntimeClass for kind: runs sandbox pods with runsc on the tainted sandbox node.
# (bakeoff/00-cluster-kind.sh installs runsc on that node. On GKE, GKE Sandbox provides the "gvisor" class.)
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: gvisor }
handler: runsc
scheduling:
  nodeSelector: { srvm.io/pool: sandbox }
  tolerations: [{ key: srvm.io/sandbox, operator: Exists, effect: NoSchedule }]
