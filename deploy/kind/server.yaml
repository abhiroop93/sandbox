# On kind: the server runs in sandbox-system, sandboxes in sandboxes (gVisor RuntimeClass "gvisor").
apiVersion: v1
kind: Namespace
metadata: { name: sandboxes, labels: { sandbox.io/role: sandboxes } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: sandbox, namespace: sandbox-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sandbox, namespace: sandboxes }
rules:
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxtemplates, sandboxwarmpools, sandboxclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, patch]   # patch: safe-to-evict + bound-restarts annotations on claimed pods
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sandbox, namespace: sandboxes }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sandbox }
subjects: [{ kind: ServiceAccount, name: sandbox, namespace: sandbox-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sandbox, namespace: sandbox-system, labels: { app: sandbox } }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the server is single-replica until the durable work queue lands (roadmap #1). Startup
  # recovery assumes no other server process is mid-operation, so old and new pods must never overlap.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: sandbox } }
  template:
    metadata: { labels: { app: sandbox } }
    spec:
      serviceAccountName: sandbox
      nodeSelector: { sandbox.io/pool: system }
      containers:
      - name: sandbox
        image: sandbox:dev
        imagePullPolicy: IfNotPresent
        args: [serve]
        ports: [{ name: http, containerPort: 8080 }]
        envFrom: [{ secretRef: { name: sandbox } }]   # ADMIN_TOKEN, S3_ACCESS_KEY, S3_SECRET_KEY (deploy/kind/secrets.sh)
        env:
        - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: sandbox-postgres, key: DATABASE_URL } } }
        - { name: SANDBOX_NAMESPACE, value: sandboxes }
        - { name: SYSTEM_NAMESPACE, value: sandbox-system }
        - { name: RUNTIME_CLASS, value: gvisor }
        - { name: HELPER_IMAGE, value: "sandbox:dev" }
        - { name: POOL_SIZE, value: "1" }
        - { name: JOB_WORKERS, value: "4" }
        - { name: AUTOSAVE_INTERVAL_SECONDS, value: "300" }  # full, process-quiesced archive; 0 disables
        - { name: SANDBOX_CPU, value: "1" }
        - { name: SANDBOX_MEMORY, value: 2Gi }   # matches the OpenSandbox SDK default; pool_size=1 bounds kind memory
        - { name: S3_ENDPOINT, value: s3.sandbox-system.svc.cluster.local:8080 }
        - { name: S3_BUCKET, value: sandbox-snapshots }
        - { name: DEFAULT_EGRESS, value: deny }
        readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 2 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: sandbox, namespace: sandbox-system }
spec:
  selector: { app: sandbox }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
